services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: rateguard
      POSTGRES_USER: rateguard
      POSTGRES_PASSWORD: rateguard
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rateguard -d rateguard"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://rateguard:rateguard@postgres:5432/rateguard
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  postgres_data:
